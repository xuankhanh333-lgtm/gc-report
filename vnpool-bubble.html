<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VN Bubble — do khoe co phieu</title>
<!-- Static page: tu fetch ./vnpool.html (const D) runtime. 3 che do: SWOT (ma tran X-Y chon truc) /
     Noi (1 truc) / Nganh (cluster theo nganh). Loc theo nganh. Nguon LLM: skills/vnpool/site/vnpool-bubble.html -->
<style>
:root{
  --bg:#faf9f5; --panel:#ffffff; --ink:#1a1a18; --muted:#6b6a64; --line:#e7e5dd;
  --long:#16a34a; --short:#e11d48; --none:#94a3b8; --accent:#BA7517;
  --qS:#16a34a; --qO:#2563eb; --qT:#d97706; --qW:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12140f; --panel:#1b1d16; --ink:#e9e7dd; --muted:#9a988c; --line:#2a2c22;
    --long:#4ade80; --short:#fb7185; --none:#6b7280;
    --qS:#4ade80; --qO:#60a5fa; --qT:#fbbf24; --qW:#f87171; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.wrap{display:flex;flex-direction:column;height:100vh}
header{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel)}
h1{font-size:14px;margin:0;font-weight:650}
.sub{font-size:11px;color:var(--muted)}
.ctrl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 10px;
  font-size:12px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;
  padding:4px 7px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
.legend{display:flex;gap:12px;font-size:12px;margin-left:auto;flex-wrap:wrap;align-items:center}
.lg{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
main{flex:1;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.axlab{position:absolute;font-size:11px;color:var(--muted);pointer-events:none;font-weight:600}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;font-size:12px;box-shadow:0 6px 22px #0004;opacity:0;
  transition:opacity .08s;max-width:250px;z-index:9;line-height:1.5}
#tip b{font-size:13px}
.trow{display:flex;justify-content:space-between;gap:14px}
.tk{color:var(--muted)} .pos{color:var(--long)} .neg{color:var(--short)}
</style></head>
<body data-palette="#16a34a,#e11d48,#94a3b8">
<div class="wrap">
<header>
  <div><h1>VN Bubble — độ khoẻ cổ phiếu</h1>
  <div class="sub" id="sub">Đang tải…</div></div>
  <div class="ctrl">Kiểu:
    <div class="seg" id="mode">
      <button data-x="swot" class="on">⊞ SWOT</button>
      <button data-x="float">◍ Nổi</button>
      <button data-x="sector">▦ Ngành</button>
    </div>
  </div>
  <div class="ctrl" id="axWrap"><span id="axLbl">Trục</span>
    <select id="axSel"></select><span id="axX">×</span>
    <select id="aySel"></select>
  </div>
  <div class="ctrl">Ngành: <select id="secSel"></select></div>
  <div class="legend">
    <span class="lg"><span class="dot" style="background:var(--long)"></span>▲ LONG</span>
    <span class="lg"><span class="dot" style="background:var(--short)"></span>▼ SHORT</span>
    <span class="lg"><span class="dot" style="background:var(--none)"></span>• trung tính</span>
  </div>
</header>
<main>
  <canvas id="cv"></canvas>
  <div class="axlab" id="axtop" style="left:10px;top:8px"></div>
  <div class="axlab" id="axbot" style="left:10px;bottom:8px"></div>
  <div class="axlab" id="axx" style="right:12px;bottom:8px"></div>
  <div id="msg">Đang tải dữ liệu vnpool…</div>
  <div id="tip"></div>
</main>
</div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const tip = document.getElementById('tip'), msg = document.getElementById('msg');
let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
let mode='swot', ax='rk', ay='score', filterSec='', DATA=[], VIS=[], SECTORS=[], started=false;
const PADT=48,PADB=40,PADL=54,PADR=16;
const MET={score:'Kỹ thuật',rk:'Cơ bản',netcash:'Tiền',pf:'P_follow',cap:'Vốn hoá'};

const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const colFor = d => d==='LONG'?css('--long'):d==='SHORT'?css('--short'):css('--none');
const glyph  = d => d==='LONG'?'▲':d==='SHORT'?'▼':'•';
const num = x => { const v = parseFloat(x); return isNaN(v) ? null : v; };
const hexA = (h,a)=>{ h=h.replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`; };

async function loadData(){
  try{
    const res = await fetch('./vnpool.html?cb=' + Date.now());
    const html = await res.text();
    const m = html.match(/const D\s*=\s*(\{[\s\S]*?\});\s*\n/);
    if(!m) throw new Error('khong tim thay const D');
    const D = JSON.parse(m[1]);
    const rows = D.rows || [];
    DATA = [];
    for(const r of rows){
      const t = r.ticker; if(!t || t==='GC') continue;
      const cap = num(r.cap_ty); if(!cap || cap<=0) continue;
      const dd = (r.net_side || r.trade_dir || '').toUpperCase();
      const dir = dd==='LONG'?'LONG':(dd==='SHORT'?'SHORT':'NONE');
      DATA.push({ t, name:r.name||t, nganh:r.nganh||'?', cap,
        score:num(r.score), rk:num(r.rk_score), netcash:num(r.netcash),
        pf:num(r.pf), conf:num(r.net_conf), dir, verdict:r.verdict||'', zone:r.dr_zone||'' });
    }
    document.getElementById('sub').textContent =
      `${DATA.length} mã · scan ${D.scanned_at||'?'} · size = vốn hoá · màu = hướng`;
    msg.style.display='none';
    DATA.forEach(d=>{ d.x=0; d.y=0; d.vx=0; d.vy=0; d.init=false; });
    sizes(); precompute(); buildUI();
    applyFilter(); setMode('swot');
    if(!started){ loop(); started=true; }
  }catch(e){ msg.textContent = 'Lỗi tải dữ liệu: ' + e.message; }
}

function sizes(){
  const caps=DATA.map(d=>d.cap); const mn=Math.min(...caps), mx=Math.max(...caps);
  const smn=Math.sqrt(mn), smx=Math.sqrt(mx)||1;
  DATA.forEach(d=>{ const s=(Math.sqrt(d.cap)-smn)/((smx-smn)||1); d.r = 10 + s*34; });
}
// percentile [0.04..0.96] cho MOI metric -> d.pct[key]; null -> -0.04
function precompute(){
  DATA.forEach(d=>d.pct={});
  for(const k of Object.keys(MET)){
    const valid = DATA.filter(d=>d[k]!==null && !isNaN(d[k])).sort((a,b)=>a[k]-b[k]);
    const nn=valid.length;
    valid.forEach((d,i)=>{ d.pct[k] = nn>1 ? 0.04 + 0.92*(i/(nn-1)) : 0.5; });
    DATA.filter(d=>d[k]===null||isNaN(d[k])).forEach(d=>{ d.pct[k] = -0.04; });
  }
  SECTORS=[...new Set(DATA.map(d=>d.nganh))].sort((a,b)=>a.localeCompare(b,'vi'));
}
function buildUI(){
  const opt=(v,t,sel)=>`<option value="${v}"${sel?' selected':''}>${t}</option>`;
  document.getElementById('axSel').innerHTML = Object.entries(MET).map(([v,t])=>opt(v,t,v===ax)).join('');
  document.getElementById('aySel').innerHTML = Object.entries(MET).map(([v,t])=>opt(v,t,v===ay)).join('');
  document.getElementById('secSel').innerHTML = opt('','Tất cả',true)+SECTORS.map(s=>opt(s,s,false)).join('');
}
function applyFilter(){
  VIS = filterSec ? DATA.filter(d=>d.nganh===filterSec) : DATA;
  DATA.forEach(d=>d.init=false); layout();
}

// tam cluster theo nganh (mode sector)
function sectorCenters(){
  const list = filterSec ? [filterSec] : SECTORS;
  const n=list.length||1;
  const cols=Math.max(1,Math.min(6,Math.ceil(Math.sqrt(n*Math.max(W,1)/Math.max(H,1)))));
  const rows=Math.ceil(n/cols);
  const cw=(W-PADL-PADR)/cols, ch=(H-PADT-PADB)/rows;
  const cen={};
  list.forEach((s,i)=>{ const c=i%cols, r=Math.floor(i/cols);
    cen[s]={x:PADL+(c+0.5)*cw, y:PADT+(r+0.5)*ch+10, top:PADT+r*ch+4}; });
  return cen;
}
let SECCEN={};
function layout(){
  const rect = cv.getBoundingClientRect(); W=rect.width; H=rect.height;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  const pw=W-PADL-PADR, ph=H-PADT-PADB;
  if(mode==='sector') SECCEN=sectorCenters();
  VIS.forEach(d=>{
    if(mode==='swot'){ d.tx=PADL+Math.max(0,d.pct[ax])*pw; d.ty=PADT+(1-Math.max(0,d.pct[ay]))*ph; }
    else if(mode==='float'){ d.ty=PADT+(1-Math.max(0,d.pct[ay]))*ph; d.tx=null; }
    else { const c=SECCEN[d.nganh]||{x:W/2,y:H/2}; d.tx=c.x; d.ty=c.y; }
    if(!d.init){
      d.x = (d.tx!=null? d.tx : W*0.05+Math.random()*W*0.9) + (Math.random()-.5)*30;
      d.y = d.ty + (Math.random()-.5)*30; d.init=true;
    }
  });
}
function step(){
  for(const d of VIS){
    d.vy += (d.ty - d.y)*0.03;
    if(d.tx!==null) d.vx += (d.tx - d.x)*0.03;
    d.vy*=0.82; d.vx*=0.80; d.x+=d.vx; d.y+=d.vy;
  }
  for(let it=0;it<3;it++){
    for(let i=0;i<VIS.length;i++)for(let j=i+1;j<VIS.length;j++){
      const a=VIS[i],b=VIS[j];
      let dx=b.x-a.x, dy=b.y-a.y, dist=Math.hypot(dx,dy)||.01;
      const min=a.r+b.r+2;
      if(dist<min){ const push=(min-dist)/2/dist; dx*=push; dy*=push;
        a.x-=dx; a.y-=dy; b.x+=dx; b.y+=dy; }
    }
  }
  for(const d of VIS){ d.x=Math.max(d.r,Math.min(W-d.r,d.x)); d.y=Math.max(PADT-14,Math.min(H-6,d.y)); }
}
function drawQuadrants(){
  const cx=PADL+(W-PADL-PADR)/2, cy=PADT+(H-PADT-PADB)/2;
  const dflt = (ax==='rk'&&ay==='score');
  const arch = dflt ? {TR:'⭐ DẪN DẮT',TL:'🚀 ĐẦU CƠ',BR:'💎 TÍCH LUỸ',BL:'⚠ TRÁNH'}
                    : {TR:`${MET[ax]}↑ ${MET[ay]}↑`,TL:`${MET[ax]}↓ ${MET[ay]}↑`,BR:`${MET[ax]}↑ ${MET[ay]}↓`,BL:`${MET[ax]}↓ ${MET[ay]}↓`};
  const zones=[
    {k:'TR',x:cx,y:PADT,w:W-PADR-cx,c:css('--qS')},
    {k:'TL',x:PADL,y:PADT,w:cx-PADL,c:css('--qT')},
    {k:'BR',x:cx,y:cy,w:W-PADR-cx,c:css('--qO')},
    {k:'BL',x:PADL,y:cy,w:cx-PADL,c:css('--qW')},
  ];
  for(const z of zones){
    ctx.fillStyle=hexA(z.c,0.9); ctx.textBaseline='top';
    ctx.textAlign=(z.x<cx)?'left':'right';
    const tx=(z.x<cx)?z.x+10:z.x+z.w-10;
    ctx.font='800 13px "Segoe UI",sans-serif'; ctx.fillText(arch[z.k], tx, z.y+8);
  }
  ctx.strokeStyle=css('--line'); ctx.lineWidth=1.2; ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(cx,PADT); ctx.lineTo(cx,H-PADB); ctx.moveTo(PADL,cy); ctx.lineTo(W-PADR,cy); ctx.stroke();
  ctx.setLineDash([]);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  if(mode==='swot') drawQuadrants();
  if(mode==='sector'){ ctx.fillStyle=css('--muted'); ctx.font='800 11.5px "Segoe UI",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='top';
    for(const s in SECCEN){ ctx.fillText(s, SECCEN[s].x, SECCEN[s].top); } }
  const ink=css('--ink');
  for(const d of VIS){
    const c=colFor(d.dir);
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,7);
    ctx.globalAlpha = d.conf!==null ? (0.45+0.5*d.conf) : 0.55;
    ctx.fillStyle=c; ctx.fill();
    ctx.globalAlpha=1; ctx.lineWidth=1.5; ctx.strokeStyle=c; ctx.stroke();
    ctx.fillStyle=ink; ctx.textAlign='center'; ctx.textBaseline='middle';
    const fs=Math.max(9,Math.min(13,d.r*0.62));
    ctx.font=`700 ${fs}px 'Segoe UI',sans-serif`;
    if(d.r>12){ ctx.fillText(d.t, d.x, d.y-1); ctx.font=`${fs*0.8}px sans-serif`; ctx.fillText(glyph(d.dir), d.x, d.y+fs*0.85); }
    else { ctx.fillText(glyph(d.dir), d.x, d.y); }
  }
}
function loop(){ step(); draw(); requestAnimationFrame(loop); }

function setMode(x){
  mode=x;
  document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.x===x));
  const aw=document.getElementById('axWrap');
  document.getElementById('axSel').style.display = (x==='swot')?'':'none';
  document.getElementById('axX').style.display = (x==='swot')?'':'none';
  document.getElementById('aySel').style.display = (x==='sector')?'none':'';
  document.getElementById('axLbl').textContent = (x==='swot')?'Trục':(x==='float')?'Trục nổi':'';
  aw.style.opacity = (x==='sector')?'0.35':'1';
  DATA.forEach(d=>d.init=false); updateAxLabels(); layout();
}
function updateAxLabels(){
  const at=document.getElementById('axtop'),ab=document.getElementById('axbot'),axl=document.getElementById('axx');
  if(mode==='sector'){ at.textContent=''; ab.textContent=''; axl.textContent='gom theo ngành'; return; }
  at.textContent='▲ '+MET[ay]+' khoẻ'; ab.textContent='▼ '+MET[ay]+' yếu';
  axl.textContent = (mode==='swot')? (MET[ax]+' (X) →  khoẻ') : '';
}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.x));
document.getElementById('axSel').onchange=e=>{ ax=e.target.value; DATA.forEach(d=>d.init=false); updateAxLabels(); layout(); };
document.getElementById('aySel').onchange=e=>{ ay=e.target.value; DATA.forEach(d=>d.init=false); updateAxLabels(); layout(); };
document.getElementById('secSel').onchange=e=>{ filterSec=e.target.value; applyFilter(); };

cv.addEventListener('mousemove',e=>{
  const rect=cv.getBoundingClientRect(); const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  let hit=null;
  for(const d of VIS){ if(Math.hypot(d.x-mx,d.y-my)<=d.r){ hit=d; break; } }
  if(hit){
    const dc=hit.dir==='LONG'?'pos':hit.dir==='SHORT'?'neg':'tk';
    const f=(v,dg=2)=>v===null?'—':(+v).toFixed(dg);
    tip.innerHTML=`<b>${hit.t}</b> <span class="tk">${hit.name}</span><br>`+
      `<span class="tk">${hit.nganh}</span> · vốn hoá <b>${Math.round(hit.cap).toLocaleString()}</b> tỷ<br>`+
      `<div class="trow"><span class="tk">Hướng</span><span class="${dc}">${glyph(hit.dir)} ${hit.dir} ${hit.conf!==null?'· conf '+f(hit.conf):''}</span></div>`+
      `<div class="trow"><span class="tk">Kỹ thuật</span><span>${f(hit.score)}</span></div>`+
      `<div class="trow"><span class="tk">Cơ bản (rk)</span><span>${f(hit.rk)}</span></div>`+
      `<div class="trow"><span class="tk">Net-cash</span><span>${f(hit.netcash,0)}</span></div>`+
      `<div class="trow"><span class="tk">P_follow</span><span>${f(hit.pf)}</span></div>`+
      (hit.verdict?`<div class="trow"><span class="tk">Verdict</span><span>${hit.verdict} ${hit.zone}</span></div>`:'');
    tip.style.opacity=1; tip.style.left=Math.min(e.clientX+14,innerWidth-260)+'px'; tip.style.top=(e.clientY+14)+'px';
    cv.style.cursor='pointer';
  } else { tip.style.opacity=0; cv.style.cursor='default'; }
});
cv.addEventListener('mouseleave',()=>tip.style.opacity=0);
addEventListener('resize',()=>{ if(DATA.length) layout(); });
loadData();
</script></body></html>
