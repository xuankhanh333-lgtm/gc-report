# Deploy GitHub Pages qua Actions (build_type=workflow) — thay pipeline legacy bi ket 06/08/2026
# (legacy builder loi "Page build failed" tu 17:35, build treo vo han sau khi reset).
# Bot push ~15'/lan -> concurrency cancel-in-progress de chi giu lan moi nhat.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
