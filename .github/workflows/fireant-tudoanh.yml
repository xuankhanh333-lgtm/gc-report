name: FireAnt tự doanh

# Kéo dữ liệu tự doanh từ FireAnt và commit JSON vào repo.
# Token đọc từ repo Secret FIREANT_TOKEN (Settings -> Secrets -> Actions).

on:
  workflow_dispatch:        # chạy tay từ tab Actions
  schedule:
    - cron: "0 9 * * 1-5"   # 09:00 UTC = 16:00 giờ VN, T2-T6 (sau khi đóng cửa)

permissions:
  contents: write           # để commit file JSON trở lại repo

concurrency:
  group: fireant-tudoanh
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài phụ thuộc
        run: pip install -r tools/fireant/requirements.txt

      - name: Kiểm tra có token chưa
        env:
          FIREANT_TOKEN: ${{ secrets.FIREANT_TOKEN }}
        run: |
          if [ -z "$FIREANT_TOKEN" ]; then
            echo "::error::Chưa có Secret FIREANT_TOKEN. Vào Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "Đã có token (dài ${#FIREANT_TOKEN} ký tự)."

      - name: Kéo tự doanh (mã lấy ĐỘNG từ vnpool.html)
        env:
          FIREANT_TOKEN: ${{ secrets.FIREANT_TOKEN }}
        run: |
          cd tools/fireant
          # Trích danh sách mã từ dashboard hiện tại; lỗi/rỗng thì fallback watchlist.txt
          python extract_symbols.py ../../vnpool.html > _symbols.txt || true
          if [ ! -s _symbols.txt ]; then
            echo "Không trích được mã động -> dùng watchlist.txt"
            cp watchlist.txt _symbols.txt
          fi
          echo "Số mã sẽ kéo: $(grep -cvE '^[[:space:]]*(#|$)' _symbols.txt)"
          python fetch_tudoanh.py \
            --symbols-file _symbols.txt \
            --days 30 \
            --with-foreign \
            --out ../../tudoanh.json

      - name: Commit kết quả (nếu có thay đổi)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tudoanh.json
          # git diff --cached bắt cả file mới (untracked) lẫn file đã đổi.
          if git diff --cached --quiet; then
            echo "Không có thay đổi, bỏ qua commit."
            exit 0
          fi
          git commit -m "auto: FireAnt tự doanh $(date -u +%Y%m%d_%H%M)"
          # Repo có automation khác push liên tục -> rebase + thử lại nhiều lần.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Đã push (lần $i)."
              exit 0
            fi
            echo "Push lần $i thất bại, chờ rồi thử lại..."
            sleep $((i * 3))
          done
          echo "::error::Không push được sau 5 lần."
          exit 1
